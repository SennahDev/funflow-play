name: Release

# Push a tag like v0.1.0 -> builds the signed APK and attaches it to a draft release.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    the release keystore, base64 encoded
#   KEYSTORE_PASSWORD  its password
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD are missing"; exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/funflowplay-release.jks
          {
            echo "storeFile=keystore/funflowplay-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=funflowplay"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk "FunFlowPlay-${GITHUB_REF_NAME#v}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: FunFlowPlay-*.apk

      - name: Remove signing key
        if: always()
        run: rm -rf keystore keystore.properties
